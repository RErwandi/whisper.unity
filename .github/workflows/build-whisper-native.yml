name: Build Whisper Native

on:
  workflow_dispatch:
    inputs:
      whisper_cpp_repo:
        description: whisper.cpp repo link
        required: true
        default: ggml-org/whisper.cpp
      whisper_cpp_repo_ref:
        description: Tag, branch or commit
        required: true
        default: v1.8.4

jobs:
  build-windows:
    name: Build Windows CPU, Vulkan and Shim
    runs-on: windows-latest
    env:
      WHISPER_REPO: ${{ github.event.inputs.whisper_cpp_repo }}
      WHISPER_REF: ${{ github.event.inputs.whisper_cpp_repo_ref }}
    steps:
      - name: Clone package repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WHISPER_REPO }}
          ref: ${{ env.WHISPER_REF }}
          path: whisper-cpp

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.0.4
        with:
          vulkan_version: 1.3.290.0
          optional_components: com.lunarg.vulkan.vma
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build CPU backend
        shell: pwsh
        run: |
          cd whisper-cpp
          cmake -S . -B build-cpu -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_VULKAN=OFF -DGGML_OPENMP=OFF
          cmake --build build-cpu --config Release --target whisper-cli whisper

      - name: Smoke test CPU backend
        shell: pwsh
        run: |
          $root = Join-Path $PWD "whisper-cpp"
          $bin = Join-Path $root "build-cpu\bin\Release"
          $model = Join-Path $root "models\ggml-tiny.en.bin"
          if (!(Test-Path $model)) {
            Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile $model
          }
          & (Join-Path $bin "whisper-cli.exe") -m $model -f (Join-Path $root "samples\jfk.wav") -otxt -of (Join-Path $bin "cpu-smoke")

      - name: Build Vulkan backend
        shell: pwsh
        run: |
          cd whisper-cpp
          cmake -S . -B build-vulkan -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_VULKAN=ON -DGGML_OPENMP=OFF
          cmake --build build-vulkan --config Release --target whisper-cli whisper

      - name: Smoke test Vulkan backend when GPU is available
        shell: pwsh
        run: |
          $root = Join-Path $PWD "whisper-cpp"
          $bin = Join-Path $root "build-vulkan\bin\Release"
          $model = Join-Path $root "models\ggml-tiny.en.bin"
          $hasVulkan = Test-Path (Join-Path ${env:VULKAN_SDK} "Bin\vulkaninfo.exe")
          if (!(Test-Path $model)) {
            Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile $model
          }
          if ($hasVulkan) {
            try {
              & (Join-Path ${env:VULKAN_SDK} "Bin\vulkaninfo.exe") --summary
              & (Join-Path $bin "whisper-cli.exe") -m $model -f (Join-Path $root "samples\jfk.wav") -otxt -of (Join-Path $bin "vulkan-smoke")
            } catch {
              "Vulkan backend not validated on this runner: $($_.Exception.Message)" | Set-Content (Join-Path $bin "vulkan-validation.txt")
            }
          } else {
            "Vulkan SDK runtime not available on this runner." | Set-Content (Join-Path $bin "vulkan-validation.txt")
          }

      - name: Build Windows shim
        shell: pwsh
        run: |
          $repoRoot = Join-Path $PWD "repo"
          $whisperRoot = Join-Path $PWD "whisper-cpp"
          cmake -S (Join-Path $repoRoot "Tools\WhisperWindowsShim") -B (Join-Path $repoRoot "Tools\WhisperWindowsShim\build") -A x64 -DCMAKE_BUILD_TYPE=Release -DWHISPER_CPP_ROOT="$whisperRoot"
          cmake --build (Join-Path $repoRoot "Tools\WhisperWindowsShim\build") --config Release

      - name: Assemble Windows plugin package
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "artifact\Packages\com.whisper.unity\Plugins\Windows"
          $cpuTarget = Join-Path $artifactRoot "backends\cpu"
          $vulkanTarget = Join-Path $artifactRoot "backends\vulkan"
          New-Item -ItemType Directory -Force -Path $cpuTarget | Out-Null
          New-Item -ItemType Directory -Force -Path $vulkanTarget | Out-Null

          Copy-Item "repo\Tools\WhisperWindowsShim\build\Release\libwhisper.dll" -Destination (Join-Path $artifactRoot "libwhisper.dll") -Force

          Copy-Item "whisper-cpp\build-cpu\bin\Release\whisper.dll" -Destination (Join-Path $cpuTarget "whisper.dll") -Force
          Copy-Item "whisper-cpp\build-cpu\bin\Release\ggml*.dll" -Destination $cpuTarget -Force

          Copy-Item "whisper-cpp\build-vulkan\bin\Release\whisper.dll" -Destination (Join-Path $vulkanTarget "whisper.dll") -Force
          Copy-Item "whisper-cpp\build-vulkan\bin\Release\ggml*.dll" -Destination $vulkanTarget -Force

          if (Test-Path "whisper-cpp\build-vulkan\bin\Release\vulkan-validation.txt") {
            Copy-Item "whisper-cpp\build-vulkan\bin\Release\vulkan-validation.txt" -Destination (Join-Path $vulkanTarget "vulkan-validation.txt") -Force
          }

      - name: Upload Windows plugin package
        uses: actions/upload-artifact@v4
        with:
          name: windows-whisper-native
          path: artifact/Packages/com.whisper.unity/Plugins/Windows
          if-no-files-found: error
